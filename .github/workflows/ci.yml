name: UPL+ Native CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows:
    name: Windows x86_64 Native Test Suite
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MinGW to PATH
      run: |
        "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Compile UPLC, UPL PM, UPL MCP & C2UPL
      run: |
        if (!(Test-Path bin)) { New-Item -ItemType Directory bin }
        gcc -O2 compiler/upl_arena.c compiler/lexer.c compiler/upl_ast.c compiler/upl_parser.c compiler/upl_codegen.c compiler/runtime/upl_comp3.c compiler/main.c -I compiler -I compiler/runtime -o bin/uplc.exe
        gcc -O2 tools/upl_pm.c -o bin/upl_pm.exe
        gcc -O2 tools/upl_mcp_server.c -o bin/upl_mcp.exe
        gcc -std=c99 -O2 tools/c2upl.c -o bin/c2upl.exe

    - name: Execute Full Verification Suite
      run: |
        cmd.exe /c test.bat

    - name: Run Formal SARIF Audit & Quickstart
      run: |
        .\bin\uplc.exe audit examples\quickstart_30s.upl --format sarif -o bin\results.sarif
        .\bin\uplc.exe run examples\quickstart_30s.upl

    - name: Test Package Manager
      run: |
        .\bin\uplc.exe pm list

    - name: Run Silicon Benchmarks
      run: |
        .\bin\uplc.exe run benchmarks\mandelbrot\mandelbrot.upl

    - name: Package Windows x64 Toolchain Artifact
      run: |
        Compress-Archive -Path bin\uplc.exe, bin\upl_pm.exe, bin\upl_mcp.exe, bin\c2upl.exe, examples\quickstart_30s.upl, README.md, LICENSE -DestinationPath bin\uplc-windows-x64.zip -Force

    - name: Upload Windows x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uplc-windows-x64
        path: bin/uplc-windows-x64.zip

  test-linux:
    name: Linux POSIX x86_64 Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile UPLC, UPL PM, UPL MCP & C2UPL (POSIX)
      run: |
        mkdir -p bin
        gcc -O2 compiler/upl_arena.c compiler/lexer.c compiler/upl_ast.c compiler/upl_parser.c compiler/upl_codegen.c compiler/runtime/upl_comp3.c compiler/main.c -I compiler -I compiler/runtime -o bin/uplc
        gcc -O2 tools/upl_pm.c -o bin/upl_pm
        gcc -O2 tools/upl_mcp_server.c -o bin/upl_mcp
        gcc -std=c99 -O2 tools/c2upl.c -o bin/c2upl

    - name: Execute Verification Suite (POSIX)
      run: |
        chmod +x test.sh upl.sh install.sh
        bash -e ./test.sh

    - name: Run Formal SARIF Audit & Quickstart (POSIX)
      run: |
        ./bin/uplc audit examples/quickstart_30s.upl --format sarif -o bin/results.sarif
        ./bin/uplc run examples/quickstart_30s.upl

    - name: Package Linux x64 Toolchain Artifact
      run: |
        tar -czf bin/uplc-linux-x64.tar.gz -C bin uplc upl_pm upl_mcp c2upl

    - name: Upload Linux x64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uplc-linux-x64
        path: bin/uplc-linux-x64.tar.gz
